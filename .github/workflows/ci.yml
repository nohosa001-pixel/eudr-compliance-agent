name: Thin Client CI & Package Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-asyncio build

      - name: Run Thin Client Unit Tests
        run: |
          PYTHONPATH=. python -m pytest -v tests/

      - name: Build & Verify Zero Server Code in Artifacts
        run: |
          python -m build
          python -c "import glob, zipfile, tarfile; whl=glob.glob('dist/*.whl')[0]; tgz=glob.glob('dist/*.tar.gz')[0]; w=[n for n in zipfile.ZipFile(whl).namelist() if n.startswith('app/') or '/app/' in n]; t=[n for n in tarfile.open(tgz).getnames() if '/app/' in n or n.endswith('/app')]; print('WHL app files:', len(w), 'TGZ app files:', len(t)); assert len(w)==0 and len(t)==0"
