[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eudr-compliance-agent"
version = "3.0.0"

description = "Cloud-Native Thin MCP Client for EUDRAgent.com — Autonomous EU Deforestation Regulation (EU 2023/1115) Compliance & TRACES-NT DDS Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "EUDRAgent Core Team", email = "admin@eudragent.com" }
]
keywords = [
    "eudr",
    "mcp",
    "model-context-protocol",
    "compliance",
    "traces-nt",
    "x402",
    "autonomous-agent",
    "thin-client"
]
dependencies = [
    "httpx>=0.26.0"
]

[project.urls]
Homepage = "https://eudragent.com"
Documentation = "https://eudragent.com/docs"
API = "https://eudragent.com/llms.txt"

[project.scripts]
eudr-mcp = "eudr_mcp_proxy:main"

[tool.setuptools]
py-modules = ["eudr_mcp_proxy"]
packages = []
