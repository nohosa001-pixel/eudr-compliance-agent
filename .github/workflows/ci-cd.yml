name: EUDRAgent CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Automated EUDR Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Run Test Suite
        env:
          PYTHONPATH: .
          USE_POSTGRES: "false"
        run: |
          python -m pytest -v tests/

  build-and-deploy:
    name: Build & Push Production Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: eudragent/compliance-agent:latest

      - name: Authenticate to Google Cloud
        if: env.GCP_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Google Cloud Run (us-central1 - eudragent.com)
        if: env.GCP_KEY != ''
        run: |
          gcloud run deploy eudr-compliance-agent \
            --source . \
            --region us-central1 \
            --project my-nohosa-87175 \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}

