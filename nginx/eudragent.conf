# ==============================================================================
# eudragent.com - Production Nginx Reverse Proxy & SSL Configuration
# Domain: eudragent.com, www.eudragent.com, api.eudragent.com
# ==============================================================================

# Rate Limiting Zone (60 requests per minute per IP for standard endpoints)
limit_req_zone $binary_remote_addr zone=eudr_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=eudr_general_limit:10m rate=120r/m;

# Upstream Backend Server (FastAPI Uvicorn Cluster)
upstream eudr_backend {
    server web:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirection & ACME Challenge for Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name eudragent.com www.eudragent.com api.eudragent.com;

    # Let's Encrypt Webroot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server (eudragent.com & www.eudragent.com & api.eudragent.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eudragent.com www.eudragent.com api.eudragent.com;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/eudragent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eudragent.com/privkey.pem;

    # High-Security SSL Protocol & Ciphers (TLS 1.2 / 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (HSTS, Anti-Clickjacking, XSS Protection)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Assets & JSON Responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client Request Limits
    client_max_body_size 50M; # Accommodates large Shapefile & GeoJSON uploads
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Static Assets Caching
    location /static/ {
        proxy_pass http://eudr_backend/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # API Endpoints (Rate Limited)
    location /api/ {
        limit_req zone=eudr_api_limit burst=20 nodelay;
        proxy_pass http://eudr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer & Timeout settings for deep satellite GIS processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Main Web App & Landing Page Proxy
    location / {
        limit_req zone=eudr_general_limit burst=50 nodelay;
        proxy_pass http://eudr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
