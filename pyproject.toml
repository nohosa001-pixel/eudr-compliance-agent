[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eudr-compliance-agent"
version = "1.2.0"
description = "Autonomous AI Agent compliance engine for EU Deforestation Regulation (EU 2023/1115)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "EUDRAgent Core Team", email = "admin@eudragent.com" }
]
keywords = [
    "eudr",
    "mcp",
    "model-context-protocol",
    "compliance",
    "traces-nt",
    "sentinel-2",
    "deforestation",
    "gis"
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=1.24.0",
    "httpx>=0.26.0",
    "python-dateutil>=2.8.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
eudr-mcp = "mcp_server_stdio:main"
